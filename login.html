<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — AI Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
        <div class="card" style="width: 100%; max-width: 400px;">
            <div style="text-align: center; margin-bottom: 30px;">
                <div class="logo" style="font-size: 32px;">AI Studio</div>
                <p style="color: #4a5568; margin-top: 10px;">Войдите в свой аккаунт</p>
            </div>
            
            <div class="form-group">
                <input type="email" id="email" class="form-control" placeholder="Email">
            </div>
            <div class="form-group">
                <input type="password" id="password" class="form-control" placeholder="Пароль">
            </div>
            
            <button class="btn btn-primary" style="width: 100%;" onclick="login()">Войти</button>
            
            <p style="text-align: center; margin-top: 20px;">
                Нет аккаунта? 
                <a href="/register" style="color: var(--primary); text-decoration: none;">Зарегистрироваться</a>
            </p>
        </div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();
            
            if (data.success) {
                window.location.href = '/dashboard';
            } else {
                alert(data.error || 'Ошибка входа');
            }
        }
    </script>
</body>
</html>
